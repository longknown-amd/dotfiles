set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run '~/.tmux/plugins/tpm/tpm'

unbind-key C-b
set-option -g prefix C-x
set-option -sg escape-time 10
set-option -g focus-event on
bind-key C-x send-prefix

set-option -g default-terminal "term-256color"
set -g history-limit 99999
set -g mouse on
# OSC 52 disabled: MobaXterm terminal does not honor the escape sequence.
# Clipboard goes through X11 forwarding via xclip instead.
set -g set-clipboard off
setw -g mode-keys vi
# Copy via ~/.local/bin/tmux-clip, which:
#   - drops selections shorter than TMUX_CLIP_MIN_LEN (default 2) so a
#     stray click registered as a 1-pixel "drag" doesn't clobber the
#     clipboard with a single character
#   - calls xclip -loops 5, which exits after a few SelectionRequests so
#     daemons can't pile up on slow X11 forwarding
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "tmux-clip"
bind -T copy-mode-vi y                  send-keys -X copy-pipe-and-cancel "tmux-clip"
bind -T copy-mode-vi Enter              send-keys -X copy-pipe-and-cancel "tmux-clip"

# Refresh DISPLAY (and friends) on reattach so panes don't keep pointing at
# a dead X socket from a previous SSH session.
set -g update-environment "DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY WINDOWID XDG_SESSION_ID"
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
