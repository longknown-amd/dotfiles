set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
run '~/.tmux/plugins/tpm/tpm'

unbind-key C-b
set-option -g prefix C-x
# 50ms gives tmux's input parser time to assemble multi-byte responses to
# its own OSC 10/11/12 queries when bytes arrive chunkily (e.g., over
# ConPTY in Windows OpenSSH + Windows Terminal). Lower values cause the
# response to be split, the leading ESC to be classified as a bare key,
# and the trailing visible bytes to leak into the pane as
# "^[]11;rgb:0000/0000/0000^[\".
set-option -sg escape-time 50
set-option -g focus-event on
bind-key C-x send-prefix

# Use a real terminfo entry. "term-256color" was a typo with no terminfo
# file, which made apps inside panes fall back to runtime OSC queries for
# things like background color, leaking responses onto the prompt.
set-option -g default-terminal "tmux-256color"
# Advertise true-color (24-bit) support for any *-256color outer terminal.
set -as terminal-features ",*-256color:RGB"
# Windows Terminal (ConPTY) sometimes loses the race draining responses to
# tmux's OSC 10/11/12 (default fg/bg/cursor color) queries, leaking the bytes
# into the active pane and producing a "^[]11;rgb:0000/0000/0000^[\" stripe
# at the prompt. Strip cstyle/ccolour from xterm* features so tmux doesn't
# issue the queries in the first place.
set -as terminal-features ",xterm*:-ccolour:-cstyle"
set -g history-limit 99999
set -g mouse on
# OSC 52 enabled for Tabby/WezTerm/Windows Terminal: clipboard transits in-band,
# no X11 forwarding required. allow-passthrough lets nvim's OSC 52 escapes bubble
# up through tmux to the outer terminal.
set -g set-clipboard on
set -g allow-passthrough on
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
setw -g mode-keys vi
# Copy bindings: pipe selection through tmux-clip, which:
#   - drops selections shorter than TMUX_CLIP_MIN_LEN (default 2) so a
#     stray click registered as a 1-pixel "drag" doesn't clobber the
#     clipboard with a single character
#   - calls `tmux load-buffer -w -`, which loads the buffer and (with
#     set-clipboard on) emits OSC 52 to the outer terminal
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe          "tmux-clip" \; send-keys -X clear-selection
bind -T copy-mode-vi y                 send-keys -X copy-pipe          "tmux-clip" \; send-keys -X clear-selection
bind -T copy-mode-vi Enter              send-keys -X copy-pipe-and-cancel "tmux-clip"

# Refresh DISPLAY (and friends) on reattach so panes don't keep pointing at
# a dead X socket from a previous SSH session.
set -g update-environment "DISPLAY XAUTHORITY SSH_AUTH_SOCK SSH_CONNECTION SSH_TTY WINDOWID XDG_SESSION_ID"
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
