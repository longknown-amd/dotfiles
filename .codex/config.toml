# AMD LLM Gateway Configuration
# Configured by AMD.ADE

model = "gpt-5.6-sol"
model_provider = "amd_gateway"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

# The baked-in model catalog marks the gpt-5.6 family (sol/terra/luna) as
# tool_mode = "code_mode_only". That makes Codex emit `custom_tool_call`
# items carrying a `namespace` field (code mode). The AMD gateway's Azure
# Responses backend does NOT support that field at any api-version and rejects
# the request: BadRequest "Unknown parameter: 'input[N].namespace'".
# This override catalog nulls tool_mode for the gpt-5.6 family so Codex sends
# flat function/shell tools instead. Regenerate after a Codex upgrade with:
#   codex debug models > /tmp/c.json && \
#   python3 -c "import json;d=json.load(open('/tmp/c.json'));[m.__setitem__('tool_mode',None) for m in d['models'] if m['tool_mode']=='code_mode_only'];json.dump(d,open('/home/thohuang/.codex/model_catalog_override.json','w'),indent=2)"
model_catalog_json = "/home/thohuang/.codex/model_catalog_override.json"

[model_providers.amd_gateway]
name = "AMD LLM Gateway"
base_url = "https://llm-api.amd.com/openai"
wire_api = "responses"
query_params = { api-version = "2025-04-01-preview" }
http_headers = { "Ocp-Apim-Subscription-Key" = "a5f0a2713dec41b695578f0b10fef327" }

[model_providers.amd_gateway.capabilities]
supports_search_tool = false

# Profile for gpt-5-codex (default)
[profiles.gpt-5-codex]
model = "gpt-5-codex"
model_provider = "amd_gateway"

# Additional model profiles
[profiles.o3]
model = "o3"
model_provider = "amd_gateway"

[profiles.gpt-5-1]
model = "gpt-5.1"
model_provider = "amd_gateway"

[profiles.gpt-5-2-codex]
model = "gpt-5.2-codex"
model_provider = "amd_gateway"

# Approval and sandbox settings
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# History settings
[history]
persistence = "save-all"

# Telemetry settings (disabled for AMD corporate environment)
[telemetry]
enabled = false

# Feedback settings (disabled for AMD corporate environment)
[feedback]
enabled = false
